services:
  searxng:
    image: ghcr.io/searxng/searxng:2026.10.23-629368e40
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run setup-free-web-search.bat to create a local secret}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    volumes:
      - ./config:/etc/searxng
      - ./cache:/var/cache/searxng
  # Bridge for Claude Desktop's managed "Web search" server: POST {"q"} ->
  # results[] here, forwarded to SearXNG's GET JSON API. No API key needed.
  search-gateway:
    image: python:3.12-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8890:8090"
    environment:
      SEARX_UPSTREAM: http://searxng:8080
      TLS_CERT: /app/certs/server.crt
      TLS_KEY: /app/certs/server.key
    volumes:
      - ./search_gateway.py:/app/search_gateway.py:ro
      - ./certs:/app/certs:ro
    command: ["python", "/app/search_gateway.py"]
    depends_on:
      - searxng
