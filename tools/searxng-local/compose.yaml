services:
  searxng:
    image: ghcr.io/searxng/searxng:2026.10.23-629368e40
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run setup-free-web-search.bat to create a local secret}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
    volumes:
      - ./config:/etc/searxng
      - ./cache:/var/cache/searxng
